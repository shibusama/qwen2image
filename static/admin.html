<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理端 · 千问知识海报</title>
<link rel="stylesheet" href="/static/style.css" />
<style>
  body { padding: 24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  .back { font-size: 13px; color: #555; text-decoration: none; }
  .back:hover { color: #000; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0 0 14px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .form-row input { flex: 1; min-width: 160px; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .btn { background: #111; color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #333; }
  .btn.danger { background: #fff; color: #d33; border: 1px solid #f0c0c0; }
  .btn.danger:hover { background: #fdf2f2; }
  .empty { color: #999; font-size: 14px; padding: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  th { color: #888; font-weight: 600; }
  .key-cell { font-family: ui-monospace, monospace; color: #666; }
  .badge { display: inline-block; background: #f3f3f3; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #444; }
  .hint { font-size: 12px; color: #999; margin-top: 8px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.ok { color: #1a7f37; }
  .msg.err { color: #d1242f; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>管理端</h1>
    <div class="sub">配置生成时可用的模型与 API Key · <a class="back" href="/">← 返回首页</a></div>

    <div class="card">
      <h2>添加模型</h2>
      <form id="addForm" class="form-row">
        <input id="name" placeholder="模型名称，如 qwen-plus / qwen-image-3.0" required />
        <input id="api_key" type="password" placeholder="API Key（sk-…）" required autocomplete="off" />
        <button type="submit" class="btn">添加</button>
      </form>
      <div id="addMsg" class="msg"></div>
      <p class="hint">说明：生成时会优先使用与管理端模型同名的 Key；没有同名时用第一条配置；都为空则回退 .env。</p>
    </div>

    <div class="card">
      <h2>已配置的模型</h2>
      <div id="list"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

function mask(key) {
  if (!key) return "";
  return key.length <= 12 ? key.slice(0, 4) + "…" : key.slice(0, 6) + "…" + key.slice(-4);
}

async function load() {
  const r = await fetch("/api/admin/models");
  const data = await r.json();
  const list = $("list");
  if (!data.ok) { list.innerHTML = '<div class="empty">加载失败</div>'; return; }
  const models = data.models || [];
  if (!models.length) { list.innerHTML = '<div class="empty">还没有配置，先在上方添加一个模型。</div>'; return; }
  let html = '<table><thead><tr><th>模型名称</th><th>API Key</th><th>备注</th><th>创建时间</th><th></th></tr></thead><tbody>';
  for (const m of models) {
    html += `<tr>
      <td><span class="badge">${escapeHtml(m.name)}</span></td>
      <td class="key-cell">${mask(m.api_key)}</td>
      <td>${escapeHtml(m.remark || "")}</td>
      <td>${escapeHtml((m.created_at || "").slice(0, 19).replace("T", " "))}</td>
      <td><button class="btn danger" data-id="${m.id}" onclick="del(${m.id})">删除</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  list.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("name").value.trim();
  const api_key = $("api_key").value.trim();
  const msg = $("addMsg");
  if (!name || !api_key) { msg.className = "msg err"; msg.textContent = "模型名称和 API Key 必填"; return; }
  const r = await fetch("/api/admin/models", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, api_key }),
  });
  const data = await r.json();
  if (data.ok) {
    msg.className = "msg ok"; msg.textContent = "已添加 " + name;
    $("name").value = ""; $("api_key").value = "";
    load();
  } else {
    msg.className = "msg err"; msg.textContent = data.error || "添加失败";
  }
});

async function del(id) {
  if (!confirm("确定删除这条配置？")) return;
  const r = await fetch("/api/admin/models/" + id, { method: "DELETE" });
  const data = await r.json();
  if (data.ok) load();
}

load();
</script>
</body>
</html>
