<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理端 · 千问知识海报</title>
<link rel="stylesheet" href="/static/style.css" />
<style>
  body { padding: 24px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  .back { font-size: 13px; color: #555; text-decoration: none; }
  .back:hover { color: #000; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0 0 14px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .form-row input, .form-row select { padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  .form-row input { flex: 1; min-width: 160px; }
  .form-row select { background: #fff; }
  .btn { background: #111; color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #333; }
  .btn.ghost { background: #fff; color: #333; border: 1px solid #ccc; }
  .btn.ghost:hover { background: #f5f5f5; }
  .btn.danger { background: #fff; color: #d33; border: 1px solid #f0c0c0; }
  .btn.danger:hover { background: #fdf2f2; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .empty { color: #999; font-size: 14px; padding: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  th { color: #888; font-weight: 600; }
  .key-cell { font-family: ui-monospace, monospace; color: #666; }
  .badge { display: inline-block; background: #f3f3f3; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #444; }
  .badge.text { background: #e8f0fe; color: #1a56db; }
  .badge.vision { background: #fdf3e7; color: #c05621; }
  .hint { font-size: 12px; color: #999; margin-top: 8px; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.ok { color: #1a7f37; }
  .msg.err { color: #d1242f; }
  .model-pick { margin-top: 10px; border: 1px dashed #ddd; border-radius: 10px; padding: 12px; display: none; }
  .model-pick.show { display: block; }
  .model-pick h4 { margin: 0 0 8px; font-size: 13px; color: #666; }
  .model-pick .tags { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; }
  .model-pick .tag { border: 1px solid #e0e0e0; border-radius: 999px; padding: 4px 10px; font-size: 12px; color: #333; cursor: pointer; background: #fff; }
  .model-pick .tag:hover { background: #f0f0f0; border-color: #aaa; }
  .model-pick .loading { color: #999; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>管理端</h1>
    <div class="sub">配置生成时可用的模型与 API Key · <a class="back" href="/">← 返回首页</a></div>

    <div class="card">
      <h2>添加模型</h2>
      <form id="addForm" class="form-row">
        <select id="model_type" title="模型类型">
          <option value="text">文本模型（摘要）</option>
          <option value="vision">视觉模型（生图）</option>
        </select>
        <input id="name" placeholder="模型名称，如 qwen-plus / qwen-image-3.0" required autocomplete="off" />
        <input id="api_key" type="password" placeholder="API Key（sk-…，输入后自动带出模型）" required autocomplete="off" />
        <button type="submit" class="btn">添加</button>
      </form>
      <button id="pickBtn" type="button" class="btn ghost">按 Key 拉取可用模型</button>
      <div id="pickBox" class="model-pick"></div>
      <div id="addMsg" class="msg"></div>
      <p class="hint">说明：文本模型用于"提炼要点"，视觉模型用于"排版成图"。输入 API Key 后点"按 Key 拉取可用模型"可自动带出可选模型（点击即可填入）。</p>
    </div>

    <div class="card">
      <h2>已配置的模型</h2>
      <div id="list"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const TYPE_LABEL = { text: "文本", vision: "视觉" };

function mask(key) {
  if (!key) return "";
  return key.length <= 12 ? key.slice(0, 4) + "…" : key.slice(0, 6) + "…" + key.slice(-4);
}

async function load() {
  const r = await fetch("/api/admin/models");
  const data = await r.json();
  const list = $("list");
  if (!data.ok) { list.innerHTML = '<div class="empty">加载失败</div>'; return; }
  const models = data.models || [];
  if (!models.length) { list.innerHTML = '<div class="empty">还没有配置，先在上方添加一个模型。</div>'; return; }
  let html = '<table><thead><tr><th>类型</th><th>模型名称</th><th>API Key</th><th>备注</th><th>创建时间</th><th></th></tr></thead><tbody>';
  for (const m of models) {
    const type = TYPE_LABEL[m.model_type] || "文本";
    const cls = m.model_type === "vision" ? "vision" : "text";
    html += `<tr>
      <td><span class="badge ${cls}">${type}</span></td>
      <td><span class="badge">${escapeHtml(m.name)}</span></td>
      <td class="key-cell">${mask(m.api_key)}</td>
      <td>${escapeHtml(m.remark || "")}</td>
      <td>${escapeHtml((m.created_at || "").slice(0, 19).replace("T", " "))}</td>
      <td><button class="btn danger" data-id="${m.id}" onclick="del(${m.id})">删除</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  list.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 按 Key 拉取可用模型列表
async function pickModels() {
  const key = $("api_key").value.trim();
  const box = $("pickBox");
  if (!key) { box.className = "model-pick show"; box.innerHTML = '<div class="msg err">请先输入 API Key</div>'; return; }
  box.className = "model-pick show";
  box.innerHTML = '<div class="loading">正在拉取可用模型…</div>';
  $("pickBtn").disabled = true;
  try {
    const r = await fetch("/api/models/list?api_key=" + encodeURIComponent(key));
    const data = await r.json();
    if (!data.ok) { box.innerHTML = '<div class="msg err">' + escapeHtml(data.error || data.detail || "拉取失败") + '</div>'; return; }
    const curType = $("model_type").value;
    const groups = [
      { label: "文本模型（摘要）", key: "text" },
      { label: "视觉模型（生图）", key: "vision" },
    ];
    box.innerHTML = groups.map(g => `
      <h4>${g.label}（${(data[g.key] || []).length} 个）</h4>
      <div class="tags">
        ${(data[g.key] || []).map(id => `<button type="button" class="tag" data-model="${escapeHtml(id)}" data-type="${g.key}">${escapeHtml(id)}</button>`).join("")}
      </div>`).join("");
    box.querySelectorAll(".tag").forEach(tag => {
      tag.addEventListener("click", () => {
        $("name").value = tag.dataset.model;
        $("model_type").value = tag.dataset.type;
        tag.style.background = "#1a56db";
        tag.style.color = "#fff";
        $("addMsg").className = "msg ok";
        $("addMsg").textContent = "已选择模型：" + tag.dataset.model;
      });
    });
    // 若当前类型没有可选模型，自动提示切到另一组
    const otherKey = curType === "text" ? "vision" : "text";
    if (!(data[curType] || []).length && (data[otherKey] || []).length) {
      $("addMsg").className = "msg";
      $("addMsg").textContent = `当前类型「${curType === "text" ? "文本" : "视觉"}」无可用模型，已展示「${otherKey === "text" ? "文本" : "视觉"}」组，点击标签会自动切换类型。`;
    }
  } catch (e) {
    box.innerHTML = '<div class="msg err">拉取失败：' + escapeHtml(e.message) + '</div>';
  } finally {
    $("pickBtn").disabled = false;
  }
}

$("pickBtn").addEventListener("click", pickModels);
$("api_key").addEventListener("keydown", (e) => { if (e.key === "Enter") pickModels(); });

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const model_type = $("model_type").value;
  const name = $("name").value.trim();
  const api_key = $("api_key").value.trim();
  const msg = $("addMsg");
  if (!name || !api_key) { msg.className = "msg err"; msg.textContent = "模型名称和 API Key 必填"; return; }
  const r = await fetch("/api/admin/models", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, api_key, model_type }),
  });
  const data = await r.json();
  if (data.ok) {
    msg.className = "msg ok"; msg.textContent = "已添加 " + (model_type === "text" ? "文本" : "视觉") + "模型 " + name;
    $("name").value = ""; $("api_key").value = "";
    $("pickBox").className = "model-pick";
    load();
  } else {
    msg.className = "msg err"; msg.textContent = data.detail || data.error || "添加失败";
  }
});

async function del(id) {
  if (!confirm("确定删除这条配置？")) return;
  const r = await fetch("/api/admin/models/" + id, { method: "DELETE" });
  const data = await r.json();
  if (data.ok) load();
}

load();
</script>
</body>
</html>
